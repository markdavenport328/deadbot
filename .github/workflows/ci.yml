name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: deadbot
          POSTGRES_PASSWORD: deadbot
          POSTGRES_DB: deadbot
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DEADBOT_DATABASE_URL: postgresql://deadbot:deadbot@localhost:5432/deadbot
      DEADBOT_DATA_STORE: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -e '.[dev,postgres]'
      - run: deadbot db-import --rebuild
      - run: pytest
      - run: deadbot evaluate
      - run: python scripts/export_openapi.py
      - run: git diff --exit-code web/openapi.json

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - run: npm run gen:types --prefix web
      - run: git diff --exit-code web/src
      - run: npm run build --prefix web
